replicaCount: 1
image:
  repository: notification-service
  tag: v1
  pullPolicy: Always

service:
  type: ClusterIP
  port: 8008

env:
  PORT: "8008"

resources:
  limits:
    cpu: 200m
    memory: 256Mi
  requests:
    cpu: 100m
    memory: 128Mi

global:
  imageRegistry: ""
  imagePullSecrets: []
